# Cloudflare Pages — static build + /api/* Pages Function on one origin.
#
# Secrets are NOT set here. Add them in the Pages dashboard under
# Settings → Environment variables (encrypted), or with:
#   npx wrangler pages secret put JWT_SECRET
#
#   JWT_SECRET             required — 64 random chars
#   GOOGLE_CLIENT_ID       optional — omit to hide Google sign-in
#   GOOGLE_CLIENT_SECRET
#   GITHUB_CLIENT_ID       optional — omit to hide GitHub sign-in
#   GITHUB_CLIENT_SECRET
#   APP_URL                optional — pin the OAuth redirect origin; defaults
#                          to the request origin, which is what you want on
#                          preview deployments
#   STRIPE_SECRET_KEY      optional — enables web checkout + portal (sk_…)
#   STRIPE_WEBHOOK_SECRET  optional — verifies /api/billing/webhook (whsec_…)
#   REVENUECAT_WEBHOOK_AUTH optional — Authorization header value that
#                          /api/billing/revenuecat requires (native IAP)
#
# Billing setup and the full launch checklist live in BILLING.md.

name = "liftit"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-15"

[[d1_databases]]
binding = "DB"
database_name = "liftit"
database_id = "17518621-e292-4aa7-888a-c15f4f38ad90"

[vars]
# Liftit Pro launch switch. While "false" (or unset) every signed-in account
# is treated as Pro and nothing is gated — the beta build behaves as if
# billing didn't exist. At launch: run `npm run cf:db:grandfather` first so
# the beta cohort keeps Pro for life, then flip this to "true".
BILLING_ENFORCED = "false"

# Stripe price ids are plain vars, not secrets. Set the plans you actually
# sell — the client only renders buy buttons for configured ones:
# STRIPE_PRICE_MONTHLY  = "price_…"
# STRIPE_PRICE_YEARLY   = "price_…"
# STRIPE_PRICE_LIFETIME = "price_…"
