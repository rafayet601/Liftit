# Validate every change, then publish passing main commits to the existing
# Cloudflare Pages Direct Upload project. PRs never receive deploy credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify service worker was emitted
        # vite-plugin-pwa silently produced no service worker when its peer
        # range didn't cover the installed Vite, and the build still exited 0.
        # Offline support is the product's headline promise, so assert it.
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing — PWA build is broken"; exit 1; }
          test -f dist/index.html
          echo "service worker present: $(wc -c < dist/sw.js) bytes"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Build production app
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Verify production artifacts
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f functions/api/[[route]].js

      - name: Deploy to existing Liftit Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=liftit --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
